[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitscan-manager"
version = "0.1.0"
description = "Bitscan manager: inventory and compliance for Ubuntu and Debian endpoints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9,<3",
    "apscheduler>=3.10,<4",
    "defusedxml>=0.7.1",
    "google-re2>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-defusedxml",
    "testcontainers>=4.8",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # Build backend (editables: hatchling's editable builds), so the project
    # installs with --no-build-isolation from hashed locks only.
    "hatchling>=1.25",
    "editables>=0.5",
]

[project.scripts]
bitscan-manager = "bitscan_manager.cli:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xml.etree".msg = "Parse XML with defusedxml only (TS §4.1)."
"xml.dom".msg = "Parse XML with defusedxml only (TS §4.1)."
"xml.sax".msg = "Parse XML with defusedxml only (TS §4.1)."
"xml.parsers.expat".msg = "Parse XML with defusedxml only (TS §4.1)."
"lxml".msg = "Parse XML with defusedxml only (TS §4.1)."
"xmlrpc".msg = "Parse XML with defusedxml only (TS §4.1)."
"plistlib".msg = "Parse XML with defusedxml only (TS §4.1)."
"re".msg = "Use re2 (google-re2) for regular expressions (TS §4.5)."

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs PostgreSQL 16 through Testcontainers (Docker)"]

[tool.coverage.run]
source = ["bitscan_manager/services"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = true
