[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitscan-manager"
version = "0.4.1"
description = "Bitscan manager: inventory and compliance for Ubuntu and Debian endpoints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9,<3",
    "apscheduler>=3.10,<4",
    "defusedxml>=0.7.1",
    "google-re2>=1.1",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # PD-19: ASGI server without the "standard" extra, Argon2id, the HTTP
    # client for OpenBao (Vault Transit API) and the HTTPS sink, the app pool,
    # and the alert counter registry.
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "psycopg-pool>=3.2",
    "prometheus-client>=0.20",
    # PD-33 (a): the low-level multipart parser for in-memory `.bit` uploads
    # (TS §4.1, §6.3); its high-level form API spools to disk and is not used.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-defusedxml",
    "testcontainers>=4.8",
    # PD-21: the contract suite validates the shared fixtures against the
    # exported JSON Schemas; the fuzz suite drives the inventory decoder.
    "jsonschema>=4.23",
    "hypothesis>=6.100",
    # Parallel test runs, one PostgreSQL container per worker (decisions
    # 2026-10-24, speed rule 3).
    "pytest-xdist>=3.6",
    # Build backend (editables: hatchling's editable builds), so the project
    # installs with --no-build-isolation from hashed locks only.
    "hatchling>=1.25",
    "editables>=0.5",
]

[project.scripts]
bitscan-manager = "bitscan_manager.cli:main"

# REQ-137 (#6, PD-28 (b)): the wheel holds only the bitscan_manager package
# (every migration file included; tests/ sits outside it). Vite writes the UI
# build into bitscan_manager/webui/, which git ignores, so it is packed as an
# artifact. Without a UI build the wheel still builds and serve runs the API
# only.
[tool.hatch.build.targets.wheel]
packages = ["bitscan_manager"]
artifacts = ["/bitscan_manager/webui/**"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xml.etree".msg = "Parse XML with defusedxml only (TS §4.1)."
"xml.dom".msg = "Parse XML with defusedxml only (TS §4.1)."
"xml.sax".msg = "Parse XML with defusedxml only (TS §4.1)."
"xml.parsers.expat".msg = "Parse XML with defusedxml only (TS §4.1)."
"lxml".msg = "Parse XML with defusedxml only (TS §4.1)."
"xmlrpc".msg = "Parse XML with defusedxml only (TS §4.1)."
"plistlib".msg = "Parse XML with defusedxml only (TS §4.1)."
"re".msg = "Use re2 (google-re2) for regular expressions (TS §4.5)."

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs PostgreSQL 16 through Testcontainers (Docker)"]

[tool.coverage.run]
source = ["bitscan_manager/services"]
branch = false

[tool.coverage.report]
fail_under = 85
# fail_under is checked against the total rounded to `precision` digits. Under
# 85 % with N statements the total is at least 5/N below 85, so 4 digits never
# round it up to 85 while N < 100,000 (at 2, 84.9955 % passed: TASK-255).
precision = 4
show_missing = true
